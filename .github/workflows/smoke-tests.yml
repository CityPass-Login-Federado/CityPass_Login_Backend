name: Smoke Test (local + prod config)

on:
    workflow_call:
    workflow_dispatch:

jobs:
    build-images:
        name: Build imágenes de test (sin push)
        runs-on: ubuntu-latest
        outputs:
            login-tag: ${{ steps.vars.outputs.login-tag }}
            anomaly-tag: ${{ steps.vars.outputs.anomaly-tag }}
        steps:
            - uses: actions/checkout@v6

            - uses: docker/setup-buildx-action@v3

            - name: Definir tags (mismos nombres que usa CD, para reusar en el compose de prod)
              id: vars
              run: |
                  echo "login-tag=ghcr.io/citypass-login-federado/citypass-login-backend:latest" >> "$GITHUB_OUTPUT"
                  echo "anomaly-tag=ghcr.io/citypass-login-federado/citypass-anomaly-detection:latest" >> "$GITHUB_OUTPUT"

            - name: Build login-federado (local, sin push)
              uses: docker/build-push-action@v6
              with:
                  context: login-federado
                  file: login-federado/Dockerfile
                  push: false
                  load: true
                  tags: ${{ steps.vars.outputs.login-tag }}

            - name: Build anomaly-detection (local, sin push)
              uses: docker/build-push-action@v6
              with:
                  context: anomaly-detection
                  file: anomaly-detection/Dockerfile
                  push: false
                  load: true
                  tags: ${{ steps.vars.outputs.anomaly-tag }}

            - name: Guardar imágenes para los jobs siguientes
              run: |
                  docker save "${{ steps.vars.outputs.login-tag }}" -o /tmp/login-backend.tar
                  docker save "${{ steps.vars.outputs.anomaly-tag }}" -o /tmp/anomaly-detection.tar

            - uses: actions/upload-artifact@v4
              with:
                  name: test-images
                  path: /tmp/*.tar
                  retention-days: 1

    smoke-test-local:
        name: docker compose up (dev, con Postgres local)
        needs: build-images
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Levantar el stack local completo
              working-directory: login-federado
              run: docker compose up -d --build --wait

            - name: Confirmar que nada se cayó
              working-directory: login-federado
              run: |
                  if docker compose ps --status=exited --quiet | grep -q .; then
                    echo "Algún servicio se cayó:"; docker compose ps; docker compose logs
                    exit 1
                  fi
                  docker compose ps

            - name: Logs (si algo falló arriba)
              if: failure()
              working-directory: login-federado
              run: docker compose logs

            - name: Bajar todo
              if: always()
              working-directory: login-federado
              run: docker compose down -v

    smoke-test-prod:
        name: docker compose up (prod, LDAP real + config validado)
        needs: build-images
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/download-artifact@v4
              with: { name: test-images, path: /tmp }

            - name: Cargar imágenes (mismos tags que usa docker-compose.prod.yml)
              run: |
                  docker load -i /tmp/login-backend.tar
                  docker load -i /tmp/anomaly-detection.tar

            - name: .env de prueba (valores dummy, no son secrets reales)
              working-directory: login-federado
              run: |
                  cat > .env <<'ENVEOF'
                  SUPABASE_DB_PASSWORD=dummy
                  SUPABASE_PROJECT_REF=dummy
                  LDAP_ADMIN_PASSWORD=admin-test
                  LDAP_CONFIG_PASSWORD=config-test
                  LDAP_READONLY_PASSWORD=readonly-test
                  LDAP_PANEL_WRITER_PASSWORD=panel-test
                  SVC_GRUPO1_SECRET=grupo1-test
                  SVC_GRUPO2_SECRET=grupo2-test
                  ANOMALY_SERVICE_URL=http://anomaly-detection:8000
                  ENVEOF

            - name: Validar sintaxis/variables del compose de prod (sin conectarse a nada externo)
              working-directory: login-federado
              run: docker compose -f docker-compose.prod.yml config --quiet

            - name: Levantar solo lo que no depende de Supabase (LDAP real, imágenes reales)
              working-directory: login-federado
              run: docker compose -f docker-compose.prod.yml up -d --wait openldap ldap-config

            - name: Confirmar que LDAP no se cayó
              working-directory: login-federado
              run: docker compose -f docker-compose.prod.yml ps openldap ldap-config

            - name: Logs (si algo falló arriba)
              if: failure()
              working-directory: login-federado
              run: docker compose -f docker-compose.prod.yml logs

            - name: Bajar todo
              if: always()
              working-directory: login-federado
              run: docker compose -f docker-compose.prod.yml down -v

            - name: Validar sintaxis/variables del compose de anomaly-detection
              working-directory: anomaly-detection
              run: |
                  cat > .env <<'ENVEOF'
                  SUPABASE_DB_PASSWORD=dummy
                  SUPABASE_PROJECT_REF=dummy
                  ENVEOF
                  docker compose -f docker-compose.prod.yml config --quiet
