name: PR Checks

# Se ejecuta en cada PR que apunte a main o develop.
# Los jobs reales viven en ci.yml (compartido con push-checks.yml).

on:
  pull_request:
    branches: [ "main", "develop" ]
    types: [ opened, synchronize, reopened ]

# ---------------------------------------------------------------------------
# TODO: para que los checks bloqueen el merge de la PR, falta:
#   - (opcional) configurar el/los jobs como "required checks" en
#     Settings > Branches > Branch protection rules
# ---------------------------------------------------------------------------

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read
      security-events: write
