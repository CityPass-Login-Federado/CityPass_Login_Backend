spring:
  application:
    name: login-federado

  sql:
    init:
      mode: always

  # --- LDAP: cuenta READONLY del directorio (solo busca y hace bind).
  # Nunca la cuenta admin: la ACL del directorio le niega todo lo demás.
  ldap:
    urls: ldap://localhost:389
    base: dc=citypass,dc=local
    username: cn=readonly,ou=ServiceAccounts,dc=citypass,dc=local
    password: ${LDAP_READONLY_PASSWORD:readonly-secret}

  # --- PostgreSQL ---
  datasource:
    url: jdbc:postgresql://localhost:5432/login_federado
    username: ${DB_USERNAME:citypass}
    password: ${DB_PASSWORD:citypass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  # --- Docker Compose support (dev) ---
  docker:
    compose:
      enabled: true
      file: docker-compose.yml

server:
  port: 8081

# --- Actuator: el mail es best-effort y async (con fallback a log), así que
# su indicador NO debe voltear la salud de la app. Sin esto, un entorno sin
# SMTP (CI) o con SMTP caído deja /actuator/health en DOWN (503) y el
# healthcheck del contenedor nunca pasa, aunque el login funcione perfecto.
# El fallo real de envío se sigue logueando en PasswordEmailService.
management:
  health:
    mail:
      enabled: false

# --- JWT / RS256 ---
# El kid NO se configura acá: se deriva del contenido de la clave
# (huella RFC 7638) en JwtKeyConfig — misma clave, mismo kid, siempre.
jwt:
  issuer: https://idp.citypass.local
  access-token-expiration-minutes: 15
  refresh-token-expiration-hours: 8
  service-token-expiration-minutes: 60
  private-key-path: file:./keys/private_key.pem
  public-key-path: file:./keys/public_key.pem
  # Dev: si faltan los PEM, se generan solos al arrancar. En staging/prod
  # ponerlo en false: si falta una clave el arranque falla en vez de
  # fabricar material criptográfico en el filesystem (JwtKeyConfig).
  auto-generate-keys: true

# --- Cuenta de escritura del backend del panel (los delegados no la conocen) ---
panel:
  ldap:
    username: cn=panel-writer,ou=ServiceAccounts,dc=citypass,dc=local
    password: ${PANEL_LDAP_PASSWORD:panel-writer-secret}

security:
  lockout:
    max-failed-attempts: 5
    window-minutes: 15

# --- Registro de clientes del IdP ---
# human: una aplicación que actúa en nombre de una persona (module fija el
#        módulo esperado; transversal: acepta personas de cualquier módulo,
#        caso único del panel — spec 01-DISENO-IDENTIDAD.md §5.1).
# service: backend a backend (client_credentials); su identidad es el
#          namespace que usa como frontera en el bus (contrato §7).
citypass:
  clients:
    - client-id: citypass-movilidad-web
      audience: citypass-movilidad-api
      module: movilidad
      type: human
    - client-id: citypass-residuos-web
      audience: citypass-residuos-api
      module: residuos
      type: human
    - client-id: citypass-reclamos-web
      audience: citypass-reclamos-api
      module: reclamos
      type: human
    - client-id: citypass-emergencias-web
      audience: citypass-emergencias-api
      module: emergencias
      type: human
    - client-id: citypass-espacios-web
      audience: citypass-espacios-api
      module: espacios
      type: human
    - client-id: citypass-analitica-web
      audience: citypass-analitica-api
      module: analitica
      type: human
    - client-id: citypass-admin-web
      audience: citypass-admin-api
      type: human
      transversal: true
    - client-id: group1
      type: service
      client-secret: ${SVC_GROUP1_SECRET:group1-secret-dev}
      audience: citypass-platform
      namespace: com.citypass.group1
    - client-id: group5
      type: service
      client-secret: ${SVC_GROUP5_SECRET:group5-secret-dev}
      audience: citypass-platform
      namespace: com.citypass.analitica

springdoc:
  swagger-ui:
    path: /docs

anomaly:
  service:
    url: ${ANOMALY_SERVICE_URL:http://localhost:8000}

# --- Self-service de contraseñas (POST /auth/forgot-password + /auth/reset-password) ---
# Flujo por token de un solo uso: la solicitud NUNCA escribe en LDAP, solo
# persiste el hash de un token y lo manda por mail (enlace). LDAP se toca
# recién al canjear el token con la nueva contraseña.
# Sin spring.mail.host (dev) NO existe JavaMailSender y se usa `debug-log`
# para mostrar el enlace en consola. Para producción habilitar SMTP con
# spring.mail.* y poner debug-log en false. IMPORTANTE: nunca exportar
# SPRING_MAIL_HOST vacío: Boot lo toma como configurado y saltea el fallback.
# --- CORS del frontend browser-based (orígenes distintos) ---
# Lista separada por comas. En prod se pisa con CORS_ALLOWED_ORIGINS
# (dashboard de Render / .env del deploy); el default ya incluye dev
# y el frontend productivo actual.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://citypass-login.pp.ua}
  password-reset:
    from: ${PASSWORD_RESET_FROM:no-reply@citypass.local}
    debug-log: ${PASSWORD_RESET_DEBUG_LOG:true}
    reset-link-base: ${PASSWORD_RESET_LINK_BASE:http://localhost:3000/reset-password}
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
    cooldown-minutes: ${PASSWORD_RESET_COOLDOWN_MINUTES:5}
    max-per-account-per-hour: ${PASSWORD_RESET_MAX_PER_ACCOUNT_PER_HOUR:3}
    max-per-ip-per-hour: ${PASSWORD_RESET_MAX_PER_IP_PER_HOUR:50}
