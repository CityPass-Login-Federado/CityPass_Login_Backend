services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: citypass-ldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "CityPass"
      LDAP_DOMAIN: "citypass.local"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
    ports:
      - "389:389"
      - "636:636"
    healthcheck:
      test: ["CMD", "ldapwhoami", "-x", "-H", "ldap://localhost:389", "-D", "cn=admin,dc=citypass,dc=local", "-w", "admin"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Configuración one-shot del directorio: overlays (memberof/refint/unique/
  # ppolicy/constraint), ACLs, índices y seed. Se ejecuta DESPUÉS de que
  # OpenLDAP está sano y en ese orden — ver ldap/config/apply-config.sh.
  ldap-config:
    image: osixia/openldap:1.5.0
    container_name: citypass-ldap-config
    entrypoint: ["/bin/bash", "/config/apply-config.sh"]
    environment:
      LDAP_HOST: openldap
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
    volumes:
      - ./ldap/config:/config:ro
    depends_on:
      openldap:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: citypass-db
    environment:
      POSTGRES_DB: login_federado
      POSTGRES_USER: citypass
      POSTGRES_PASSWORD: citypass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: citypass-login
    ports:
      - "8081:8081"
    environment:
      DB_USERNAME: "citypass"
      DB_PASSWORD: "citypass"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/login_federado"
      SPRING_LDAP_URLS: "ldap://openldap:389"
      SPRING_LDAP_USERNAME: "cn=readonly,ou=ServiceAccounts,dc=citypass,dc=local"
      SPRING_LDAP_PASSWORD: "readonly-secret"
      PANEL_LDAP_USERNAME: "cn=panel-writer,ou=ServiceAccounts,dc=citypass,dc=local"
      PANEL_LDAP_PASSWORD: "panel-writer-secret"
      SVC_GROUP1_SECRET: "group1-secret-dev"
      SVC_GROUP5_SECRET: "group5-secret-dev"
      ANOMALY_SERVICE_URL: "http://anomaly-detection:8000"
      # --- SMTP (recupero de contraseña) ---
      # OJO: el default vacío ("${VAR:-}") está prohibido acá: Boot lo
      # interpreta como host configurado, crea JavaMailSender igual y se
      # saltea el fallback de desarrollo (issue 7). La línea de abajo es
      # PASSTHROUGH puro (sin `:-`): el valor viene del .env o la shell del
      # operador. Si está ausente o en blanco, la app lo detecta en código
      # (PasswordEmailService: host en blanco = sin SMTP) y loguea el
      # enlace (modo dev). Nunca se exporta un default inventado.
      # Gmail: HOST=smtp.gmail.com PORT=587 USER=tucuenta@gmail.com
      #   PASS=<contraseña de aplicación> FROM=tucuenta@gmail.com
      #   (cuenta con 2FA: https://myaccount.google.com/apppasswords —
      #   la clave común NO sirve, Google la rechaza con 535).
      # Mailpit local (ver servicio comentado abajo): HOST=mailpit PORT=1025,
      #   sin USER/PASS, FROM lo que sea.
      SPRING_MAIL_HOST: "${SPRING_MAIL_HOST}"
      SPRING_MAIL_PORT: "${SPRING_MAIL_PORT:-587}"
      SPRING_MAIL_USERNAME: "${SPRING_MAIL_USERNAME:-}"
      SPRING_MAIL_PASSWORD: "${SPRING_MAIL_PASSWORD:-}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "${SPRING_MAIL_SMTP_AUTH:-true}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "${SPRING_MAIL_SMTP_STARTTLS:-true}"
      PASSWORD_RESET_FROM: "${PASSWORD_RESET_FROM:-no-reply@citypass.local}"
      PASSWORD_RESET_DEBUG_LOG: "${PASSWORD_RESET_DEBUG_LOG:-true}"
    depends_on:
      openldap:
        condition: service_healthy
      ldap-config:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      anomaly-detection:
        condition: service_started

  anomaly-detection:
    build: ../anomaly-detection
    container_name: citypass-anomaly-detection
    ports:
      - "8000:8000"
    environment:
      ANOMALY_DB_URL: "postgresql://citypass:citypass@postgres:5432/login_federado"
    depends_on:
      - postgres

  # Buzón falso local: atrapa TODO lo que mande la app y lo muestra en
  # http://localhost:8025 (no llega nada afuera, ideal para probar el
  # recupero con mails @citypass.local que no existen).
  # Uso: descomentar, luego en la shell (o .env):
  #   SPRING_MAIL_HOST=mailpit SPRING_MAIL_PORT=1025 SPRING_MAIL_SMTP_AUTH=false
  # y levantar con docker compose up -d.
  # mailpit:
  #   image: axllent/mailpit:v1.24
  #   container_name: citypass-mailpit
  #   restart: unless-stopped
  #   ports:
  #     - "8025:8025"   # UI web
  #     - "1025:1025"   # SMTP

volumes:
  pgdata:
