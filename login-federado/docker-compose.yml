services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: citypass-ldap
    environment:
      LDAP_ORGANISATION: "CityPass"
      LDAP_DOMAIN: "citypass.local"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
    ports:
      - "389:389"
      - "636:636"
    healthcheck:
      test: ["CMD", "ldapwhoami", "-x", "-H", "ldap://localhost:389", "-D", "cn=admin,dc=citypass,dc=local", "-w", "admin"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Configuración one-shot del directorio: overlays (memberof/refint/unique/
  # ppolicy/constraint), ACLs, índices y seed. Se ejecuta DESPUÉS de que
  # OpenLDAP está sano y en ese orden — ver ldap/config/apply-config.sh.
  ldap-config:
    image: osixia/openldap:1.5.0
    container_name: citypass-ldap-config
    entrypoint: ["/bin/bash", "/config/apply-config.sh"]
    environment:
      LDAP_HOST: openldap
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
    volumes:
      - ./ldap/config:/config:ro
    depends_on:
      openldap:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: citypass-db
    environment:
      POSTGRES_DB: login_federado
      POSTGRES_USER: citypass
      POSTGRES_PASSWORD: citypass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: citypass-login
    ports:
      - "8081:8081"
    environment:
      DB_USERNAME: "citypass"
      DB_PASSWORD: "citypass"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/login_federado"
      SPRING_LDAP_URLS: "ldap://openldap:389"
      SPRING_LDAP_USERNAME: "cn=readonly,ou=ServiceAccounts,dc=citypass,dc=local"
      SPRING_LDAP_PASSWORD: "readonly-secret"
      PANEL_LDAP_USERNAME: "cn=panel-writer,ou=ServiceAccounts,dc=citypass,dc=local"
      PANEL_LDAP_PASSWORD: "panel-writer-secret"
      SVC_GROUP1_SECRET: "group1-secret-dev"
      SVC_GROUP2_SECRET: "group2-secret-dev"
      ANOMALY_SERVICE_URL: "http://anomaly-detection:8000"
    depends_on:
      openldap:
        condition: service_healthy
      ldap-config:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      anomaly-detection:
        condition: service_started

  anomaly-detection:
    build: ../anomaly-detection
    container_name: citypass-anomaly-detection
    ports:
      - "8000:8000"
    environment:
      ANOMALY_DB_URL: "postgresql://citypass:citypass@postgres:5432/login_federado"
    depends_on:
      - postgres

volumes:
  pgdata:
